name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v1.0.0, v1.0.1)'
        required: false
        default: 'v1.0.0'
      prerelease:
        description: 'Mark as pre-release?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0 libsqlite3-dev
          flutter pub get

      - name: Run Tests
        run: flutter test --concurrency=1

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Prepare Release Artifacts
        id: prep
        run: |
          RAW_TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "main" ] || [ "$RAW_TAG" = "master" ]; then
            RAW_TAG="v1.0.0"
          fi
          echo "RESOLVED_TAG=$RAW_TAG" >> $GITHUB_ENV

          mkdir -p release-artifacts
          # Provide both versioned filename and static latest filename
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/SariMe-$RAW_TAG.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/app-release.apk
          echo "Generated APK artifacts:"
          ls -lh release-artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RESOLVED_TAG }}
          name: "SariMe ${{ env.RESOLVED_TAG }} - Offline Sari-Sari Store POS"
          body: |
            ### 🛒 SariMe Release ${{ env.RESOLVED_TAG }}
            
            An offline-first Android mobile POS & ledger app designed for Filipino sari-sari store owners.
            
            #### 📥 Download & Install
            1. Download the **`app-release.apk`** or **`SariMe-${{ env.RESOLVED_TAG }}.apk`** below on your Android phone.
            2. Open the downloaded file and tap **Install** (allow *Install Unknown Apps* if prompted).
            3. Enjoy full offline selling, barcode scanning, utang credit ledger, and daily profit tracking!
            
            #### 🌐 Web Landing Page
            Visit the official web page: [https://watot12345.github.io/sarisariApp/](https://watot12345.github.io/sarisariApp/)
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-artifacts/SariMe-*.apk
            release-artifacts/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
