name: tindahan
description: "SariMe - An offline-first Android mobile app for Filipino sari-sari store owners."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Formatting & Localizations
  intl: ^0.19.0

  # Local SQLite database
  sqflite: ^2.3.3
  path: ^1.9.0

  # Device Hardware (Offline)
  mobile_scanner: ^5.2.3

  # System Share & Files (Backup / Restore)
  share_plus: ^9.0.0
  path_provider: ^2.1.3

  # UI & Charts
  fl_chart: ^0.68.0
  image_picker: ^1.2.4
  home_widget: ^0.10.0
  flutter_local_notifications: ^21.0.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
